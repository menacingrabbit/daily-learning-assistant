name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails if compose still requires .env (checkout has none - it's gitignored).
      - name: Compose config is valid without .env
        run: docker compose config -q

      - name: Build image
        run: docker build -t daily-learning:ci .

      # Entrypoint seeds topics.yaml, app runs with no credentials, exits 0.
      # --testrun avoids attaching readline to CI stdin the way --once would.
      - name: Smoke test (dry run, no credentials)
        run: docker run --rm daily-learning:ci node dist/index.js --testrun

      # Regression guard: a personal config must never be baked into the image.
      - name: Image contains only the example config
        run: >
          docker run --rm --entrypoint sh daily-learning:ci
          -c 'test ! -f /app/config/topics.yaml && test -f /app/config/topics.example.yaml'
